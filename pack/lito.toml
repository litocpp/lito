[package]
name = "lito-pack"
version.workspace = true

[lib]
name = "lito-pack"
module = "lito.pack"
archive = "lito.pack"

[[bin]]
module = "lito.package_embed"
name = "lito-package-embed"
sources = ["src/package_embed.cppm"]
host-tool = true
link-stdlib = false

[dependencies]
lito-core = { workspace = true, visibility = "public" }
lito-zstd = { workspace = true, visibility = "private" }
licrypto = { workspace = true, visibility = "private" }
rstd-std = { workspace = true, visibility = "public" }
rstd-json = { workspace = true, visibility = "private" }
rstd-nostd = { workspace = true, visibility = "link" }
