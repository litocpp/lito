[package]
name = "fixture-profile"
version = "0.1.0"

[[bin]]
name = "profile-check"
sources = ["main.cpp"]

[profile.perf]
inherits = "release"
opt-level = 2
debug = "line-tables-only"
strip = false
lto = false

[profile.aliases]
inherits = "perf"
opt-level = "z"
debug = 1
strip = true
lto = true

[profile.codegen-variant]
inherits = "perf"
debug = "full"
strip = "symbols"
lto = "thin"

[profile.strip-debug]
inherits = "codegen-variant"
strip = "debuginfo"
