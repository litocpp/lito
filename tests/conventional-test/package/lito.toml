[package]
name = "fixture-conventional-library"
version = "0.1.0"

[lib]
name = "fixture-conventional-library"
module = "fixture.conventional"
archive = "fixture-conventional"
sources = ["src/lib.cppm"]

[dev-dependencies.fixture-conventional-bench-helper]
path = "bench-helper"

[profile.thin]
inherits = "release"
opt-level = 2
debug = "none"
strip = "none"
lto = "thin"

[profile.fat]
inherits = "release"
opt-level = 2
debug = "none"
strip = "none"
lto = "fat"
