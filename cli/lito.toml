[package]
name = "lito"
version.workspace = true

[[bin]]
module = "lito.executable"
name = "lito"
discovery = "module"

[usage]
private-options = [
  "-fPIC",
  "-fsized-deallocation",
]
private-linker-options = ["-nostdlib++"]

[dependencies.lito-core]
workspace = true
visibility = "private"

[dependencies.rstd-std]
workspace = true
visibility = "private"

[dependencies.rstd-argparse]
workspace = true
visibility = "private"

[dependencies.rstd-nostd]
workspace = true
visibility = "runtime"
