[workspace]
name = "lito"
members = ["third-party/zstd", "third-party/libsodium", "archive", "frontend", "core", "cpp", "tools", "toolchain", "driver", "cli"]
default-members = ["cli"]

[workspace.package]
version = "0.6.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies.lito-frontend]
path = "frontend"

[workspace.dependencies.lito-core]
path = "core"

[workspace.dependencies.lito-cpp]
path = "cpp"

[workspace.dependencies.lito-tools]
path = "tools"

[workspace.dependencies.lito-toolchain]
path = "toolchain"

[workspace.dependencies.lito-driver]
path = "driver"

[workspace.dependencies.lito-zstd]
path = "third-party/zstd"

[workspace.dependencies.lito-sodium]
path = "third-party/libsodium"

[workspace.dependencies.lito-archive]
path = "archive"

[workspace.dependencies.luato]
git = "https://github.com/litocpp/luato.git"

[workspace.dependencies.rstd-std]
git = "https://github.com/litocpp/rstd.git"

[workspace.dependencies.rstd-nostd]
git = "https://github.com/litocpp/rstd.git"

[workspace.dependencies.rstd-json]
git = "https://github.com/litocpp/rstd.git"

[workspace.dependencies.rstd-serde]
git = "https://github.com/litocpp/rstd.git"

[workspace.dependencies.rstd-bench]
git = "https://github.com/litocpp/rstd.git"

[workspace.dependencies.rstd-toml]
git = "https://github.com/litocpp/rstd.git"

[workspace.dependencies.rstd-argparse]
git = "https://github.com/litocpp/rstd.git"

[workspace.dependencies.rstd-test]
git = "https://github.com/litocpp/rstd.git"

[workspace.external-sources.zstd]
git = "https://github.com/facebook/zstd.git"
rev = "f8745da6ff1ad1e7bab384bd1f9d742439278e99"

[workspace.external-sources.libsodium]
git = "https://github.com/jedisct1/libsodium.git"
rev = "77e1ce5d6dee871c49ef211222ba18ef0c486bda"

[profile.base]
exceptions = false
rtti = false

[profile.perf]
inherits = "release"
opt-level = 2
debug = "line-tables-only"
strip = "none"
lto = "off"
