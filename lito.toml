[workspace]
name = "lito"
members = ["third-party/zstd", "frontend", "core", "pack", "cpp", "tools", "toolchain", "driver", "cli"]
default-members = ["cli"]

[workspace.package]
version = "0.7.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
lito-frontend = { path = "frontend" }
lito-core = { path = "core" }
lito-pack = { path = "pack" }
lito-cpp = { path = "cpp" }
lito-tools = { path = "tools" }
lito-toolchain = { path = "toolchain" }
lito-driver = { path = "driver" }
lito-zstd = { path = "third-party/zstd" }
licrypto = { git = "https://github.com/litocpp/licrypto.git" }
luato = { git = "https://github.com/litocpp/luato.git" }
rstd-std = { version = "0.1.0" }
rstd-nostd = { version = "0.1.0" }
rstd-json = { version = "0.1.0" }
rstd-serde = { version = "0.1.0" }
rstd-bench = { version = "0.1.0" }
rstd-toml = { version = "0.1.0" }
rstd-argparse = { version = "0.1.0" }
rstd-test = { version = "0.1.0" }

[workspace.external-sources.zstd]
git = "https://github.com/facebook/zstd.git"
rev = "f8745da6ff1ad1e7bab384bd1f9d742439278e99"

[profile.base]
exceptions = false
rtti = false

[profile.perf]
inherits = "release"
opt-level = 2
debug = "line-tables-only"
strip = "none"
lto = "off"
