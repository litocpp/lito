[package]
name = "cmake-valid"
version = "0.1.0"
module = "cmake_valid"

[library]
archive = "cmake_valid"
discovery = "module"

[external-dependencies.cmake.vulkan]
find-package = "Vulkan"
targets = [{ name = "Vulkan::Vulkan", visibility = "public" }]

[external-dependencies.cmake.fixture]
find-package = "TenonFixture"
path = "../../../cmake/package"
config-directory = "lib/cmake/TenonFixture"
cache = { TENON_FIXTURE_OPTION = true }
targets = [
  { name = "TenonFixture::fixture", visibility = "private" },
  { name = "TenonFixture::headers", visibility = "public" },
  { name = "TenonFixture::order", visibility = "runtime" },
]
