[package]
name = "lito-core"
version.workspace = true
module = "lito"

[library]
archive = "lito"
discovery = "module"

[usage]
private-options = [
  "-fPIC",
  "-Wall",
  "-Wpedantic",
  "-Wno-gnu-statement-expression",
  "-Wno-deprecated-declarations",
  "-Wunknown-attributes",
  "-fsized-deallocation",
]

[dependencies.lito-frontend]
workspace = true
visibility = "public"

[dependencies.rstd-std]
workspace = true
visibility = "public"

[dependencies.rstd-json]
workspace = true
visibility = "private"

[dependencies.rstd-bench]
workspace = true
visibility = "private"

[dependencies.rstd-toml]
workspace = true
visibility = "private"

[dependencies.rstd-nostd]
workspace = true
visibility = "runtime"
