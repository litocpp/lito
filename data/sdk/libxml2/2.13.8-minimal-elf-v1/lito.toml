[package]
name = "lito-llvm-sdk-libxml2"
version = "2.13.8"
standard = "c17"
license = "MIT"

[external-sources.libxml2]
archive = "https://download.gnome.org/sources/libxml2/2.13/libxml2-2.13.8.tar.xz"
sha256 = "277294cb33119ab71b2bc81f2f445e9bc9435b893ad15bb2cd2b0e859a0ee84a"

[source-groups.runtime]
external-source = "libxml2"
sources = [
  "buf.c",
  "c14n.c",
  "catalog.c",
  "chvalid.c",
  "debugXML.c",
  "dict.c",
  "encoding.c",
  "entities.c",
  "error.c",
  "globals.c",
  "hash.c",
  "HTMLparser.c",
  "HTMLtree.c",
  "legacy.c",
  "list.c",
  "nanoftp.c",
  "nanohttp.c",
  "parser.c",
  "parserInternals.c",
  "pattern.c",
  "relaxng.c",
  "SAX.c",
  "SAX2.c",
  "schematron.c",
  "threads.c",
  "tree.c",
  "uri.c",
  "valid.c",
  "xinclude.c",
  "xlink.c",
  "xmlIO.c",
  "xmlmemory.c",
  "xmlmodule.c",
  "xmlreader.c",
  "xmlregexp.c",
  "xmlsave.c",
  "xmlschemas.c",
  "xmlschemastypes.c",
  "xmlstring.c",
  "xmlunicode.c",
  "xmlwriter.c",
  "xpath.c",
  "xpointer.c",
  "xzlib.c",
]

[lib]
name = "libxml2-bootstrap"
archive = "libxml2-bootstrap"
source-groups = ["runtime"]

[usage]
private-include-directories = [
  { path = ".", root = "generated" },
  { path = "include", root = "generated" },
  { external-source = "libxml2", path = "." },
  { external-source = "libxml2", path = "include" },
]
private-definitions = ['SYSCONFDIR="/etc"']
options = ["-fPIC", "-ffunction-sections", "-fdata-sections"]

[profile.sdk]
inherits = "release"
opt-level = "z"
debug = "none"
strip = "none"
lto = "off"
