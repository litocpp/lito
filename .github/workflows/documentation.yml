name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "doc/**"
      - "install.sh"
      - ".github/workflows/documentation.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Litobook
        env:
          LITOBOOK_URL: https://github.com/litocpp/litodoc/releases/download/v0.1.0/litobook-linux-x86_64.tar.gz
        run: |
          archive="$RUNNER_TEMP/litobook-linux-x86_64.tar.gz"
          checksum="$archive.sha256"
          curl -fsSL "$LITOBOOK_URL" -o "$archive"
          curl -fsSL "$LITOBOOK_URL.sha256" -o "$checksum"
          cd "$RUNNER_TEMP"
          sha256sum --check "$(basename "$checksum")"
          tar -xzf "$(basename "$archive")"
          echo "$RUNNER_TEMP/litobook-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Check book
        run: litobook check -C doc

      - name: Build book
        run: litobook build -C doc --out build/pages

      - name: Add installer
        run: install -m 0644 install.sh doc/build/pages/install.sh

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: doc/build/pages

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
