name: Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install LLVM 22
        run: |
          wget --quiet https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install --yes libc++-22-dev libc++abi-22-dev lld-22 ninja-build
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"
          /usr/lib/llvm-22/bin/clang++ --version

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release --parallel 2

      - name: Package
        env:
          LITO_ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$LITO_ARCH"
          cpack --preset release
          build/cmake-release/cli/lito --help >/dev/null
          tar -tzf lito-v*-linux-$LITO_ARCH.tar.gz

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: lito-linux-${{ matrix.arch }}
          path: |
            lito-v*-linux-${{ matrix.arch }}.tar.gz
            lito-v*-linux-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error

  macos:
    name: macOS aarch64
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install LLVM 22
        env:
          LLVM_VERSION: 22.1.8
          LLVM_SHA256: f260f4f7c0d430828a81ae8a3826a1d63fc0963ec2459489308cc23b1f7eab4f
        run: |
          archive="$RUNNER_TEMP/LLVM-$LLVM_VERSION-macOS-ARM64.tar.xz"
          install_dir="$RUNNER_TEMP/llvm-$LLVM_VERSION"
          url="https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/LLVM-$LLVM_VERSION-macOS-ARM64.tar.xz"

          curl --fail --location --retry 3 "$url" --output "$archive"
          echo "$LLVM_SHA256  $archive" | shasum --algorithm 256 --check
          mkdir -p "$install_dir"
          tar -xJf "$archive" -C "$install_dir" --strip-components=1
          echo "$install_dir/bin" >> "$GITHUB_PATH"
          "$install_dir/bin/clang++" --version

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release --parallel 2

      - name: Package
        run: |
          test "$(uname -m)" = "arm64"
          cpack --preset release
          build/cmake-release/cli/lito --help >/dev/null
          tar -tzf lito-v*-macos-aarch64.tar.gz

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: lito-macos-aarch64
          path: |
            lito-v*-macos-aarch64.tar.gz
            lito-v*-macos-aarch64.tar.gz.sha256
          if-no-files-found: error

  windows:
    name: Windows x86_64
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install LLVM 22
        shell: pwsh
        env:
          LLVM_VERSION: 22.1.8
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "LLVM-$env:LLVM_VERSION-win64.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "LLVM-$env:LLVM_VERSION"
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/LLVM-$env:LLVM_VERSION-win64.exe"

          curl.exe --fail --location --retry 3 $url --output $installer
          $process = Start-Process -FilePath $installer -ArgumentList "/S", "/D=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "LLVM installer failed with exit code $($process.ExitCode)"
          }

          $llvmBin = Join-Path $installDir "bin"
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $llvmBin "clang++.exe") --version

      - name: Configure
        shell: pwsh
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release --parallel 2

      - name: Package
        shell: pwsh
        run: |
          cpack --preset release
          & "build/cmake-release/cli/lito.exe" --help | Out-Null
          tar -tf (Get-ChildItem "lito-v*-windows-x86_64.zip").FullName

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: lito-windows-x86_64
          path: |
            lito-v*-windows-x86_64.zip
            lito-v*-windows-x86_64.zip.sha256
          if-no-files-found: error

  release:
    name: Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: lito-*
          path: dist
          merge-multiple: true

      - name: Prepare release notes
        id: release-notes
        uses: hypengw/appstream-release-notes-action@v0.1.0
        with:
          file: release.xml
          version: ${{ github.ref_name }}

      - name: Publish immutable release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "dist/*.tar.gz,dist/*.zip,dist/*.sha256"
          artifactErrorsFailBuild: true
          bodyFile: ${{ steps.release-notes.outputs.path }}
          immutableCreate: true
          tag: ${{ github.ref_name }}
