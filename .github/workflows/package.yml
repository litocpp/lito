name: Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install LLVM 22
        run: |
          wget --quiet https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install --yes libc++-22-dev libc++abi-22-dev lld-22 ninja-build

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build/cmake-package \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=/usr/bin/clang-22 \
            -DCMAKE_CXX_COMPILER=/usr/bin/clang++-22

      - name: Build
        run: cmake --build build/cmake-package --target lito --parallel 2

      - name: Package
        env:
          LITO_ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$LITO_ARCH"
          package="lito-linux-$LITO_ARCH"
          cmake --install build/cmake-package --prefix "dist/$package" --strip
          "dist/$package/bin/lito" --help >/dev/null
          tar -C dist -czf "dist/$package.tar.gz" "$package"
          tar -tzf "dist/$package.tar.gz"
          cd dist
          sha256sum "$package.tar.gz" >"$package.tar.gz.sha256"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: lito-linux-${{ matrix.arch }}
          path: |
            dist/lito-linux-${{ matrix.arch }}.tar.gz
            dist/lito-linux-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error

  windows:
    name: Windows x86_64
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install LLVM 22
        shell: pwsh
        env:
          LLVM_VERSION: 22.1.8
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "LLVM-$env:LLVM_VERSION-win64.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "LLVM-$env:LLVM_VERSION"
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/LLVM-$env:LLVM_VERSION-win64.exe"

          curl.exe --fail --location --retry 3 $url --output $installer
          $process = Start-Process -FilePath $installer -ArgumentList "/S", "/D=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "LLVM installer failed with exit code $($process.ExitCode)"
          }

          $llvmBin = Join-Path $installDir "bin"
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $llvmBin "clang++.exe") --version

      - name: Configure
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B build/cmake-package `
            -G Ninja `
            "-DCMAKE_BUILD_TYPE=Release" `
            "-DCMAKE_C_COMPILER=clang.exe" `
            "-DCMAKE_CXX_COMPILER=clang++.exe"

      - name: Build
        run: cmake --build build/cmake-package --target lito --parallel 2

      - name: Package
        shell: pwsh
        run: |
          $package = "lito-windows-x86_64"
          $archive = "dist/$package.zip"
          cmake --install build/cmake-package --prefix "dist/$package" --strip
          & "dist/$package/bin/lito.exe" --help | Out-Null
          Compress-Archive -Path "dist/$package" -DestinationPath $archive
          tar -tf $archive

          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $package.zip" | Set-Content -Encoding ascii "$archive.sha256"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: lito-windows-x86_64
          path: |
            dist/lito-windows-x86_64.zip
            dist/lito-windows-x86_64.zip.sha256
          if-no-files-found: error

  release:
    name: Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: lito-*
          path: dist
          merge-multiple: true

      - name: Prepare release notes
        id: release-notes
        uses: hypengw/appstream-release-notes-action@v0.1.0
        with:
          file: release.xml
          version: ${{ github.ref_name }}

      - name: Publish immutable release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "dist/*.tar.gz,dist/*.zip,dist/*.sha256"
          artifactErrorsFailBuild: true
          bodyFile: ${{ steps.release-notes.outputs.path }}
          immutableCreate: true
          tag: ${{ github.ref_name }}
